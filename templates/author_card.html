<a href="/author/{{.ID}}" class="author-link">
    <div class="author-card">
        <div class="author-info">
            <h2>{{.Name}}</h2>
            <p class="composition">Состав: {{.Composition}}</p>
            <p class="description">{{.Description}}</p>
        </div>
        <div class="author-image">
            <img src="{{.ImageURL}}" alt="{{.Name}}">
        </div>
    </div>
</a>
